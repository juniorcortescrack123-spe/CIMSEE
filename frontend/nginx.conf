server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;   # contratos escaneados (PDF)

  # la API vive en el contenedor "backend"; asi el navegador solo habla con un puerto (80)
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # React Router: cualquier otra ruta devuelve index.html
  location / {
    try_files $uri /index.html;
  }
}
