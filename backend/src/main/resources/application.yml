spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://cimse-db:5432/cimse}
    username: ${DB_USER:cimse_user}
    password: ${DB_PASS:cimse_pass}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none        # el esquema lo crea database/schema.sql
    open-in-view: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
server:
  port: 8080
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
cimse:
  app-url: ${APP_URL:http://localhost:5173}
  storage:
    dir: ${CIMSE_STORAGE_DIR:./uploads}
  clave:
    dias-vigencia: ${CLAVE_DIAS_VIGENCIA:3}
  mail:
    from: ${MAIL_FROM:}
